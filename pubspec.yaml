name: akribos_app
description: "Akribos – Bibelstudium auf Smartphones und Tablets."
publish_to: 'none'
# Development fallback. Play releases use the GitHub tag and an automatic build number.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  app_links: ^7.2.2
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.6
  html2md: ^1.3.2
  markdown: ^7.3.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/wordmark.png
    - assets/fonts/OFL-Akribos-Text.txt
    - assets/fonts/OFL-Noto-Sans-Hebrew.txt
  fonts:
    - family: AkribosText
      fonts:
        - asset: assets/fonts/akribos-text-regular.ttf
          weight: 400
        - asset: assets/fonts/akribos-text-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/akribos-text-semibold.ttf
          weight: 600
        - asset: assets/fonts/akribos-text-semibold-italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/akribos-text-bold.ttf
          weight: 700
        - asset: assets/fonts/akribos-text-bold-italic.ttf
          weight: 700
          style: italic
    - family: NotoSansHebrew
      fonts:
        - asset: assets/fonts/noto-sans-hebrew-hebrew-400-normal.ttf
          weight: 400
        - asset: assets/fonts/noto-sans-hebrew-hebrew-600-normal.ttf
          weight: 600
        - asset: assets/fonts/noto-sans-hebrew-hebrew-700-normal.ttf
          weight: 700

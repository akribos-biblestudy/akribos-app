name: iOS Store Screenshots
on:
  push:
    branches: [codex/ios-store-screenshots-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Capture live public reader on iPhone and iPad
        shell: bash
        run: |
          mkdir -p screenshots
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'devices.json').read_text())
          devices=[d for runtime,ds in data['devices'].items() if 'iOS' in runtime for d in ds if d.get('isAvailable')]
          selected=[]
          for kind, names in [('iphone',['iPhone 16 Pro','iPhone 15 Pro','iPhone 16','iPhone 15']),('ipad',['iPad Pro 13-inch (M4)','iPad Pro 13-inch (M5)','iPad Pro (12.9-inch) (6th generation)'])]:
              match=next((d for name in names for d in devices if d['name']==name),None)
              if not match: raise SystemExit(f'Missing supported {kind}: {devices}')
              selected.append({'kind':kind,**match})
          Path('screenshots/devices.json').write_text(json.dumps(selected,indent=2))
          Path(os.environ['RUNNER_TEMP']+'/capture-devices.tsv').write_text(''.join(d['kind']+'\t'+d['udid']+'\n' for d in selected))
          PY
          while IFS=$'\t' read -r kind udid; do
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcrun simctl ui "$udid" appearance light
            xcrun simctl install "$udid" build/ios/iphonesimulator/Runner.app
            xcrun simctl launch "$udid" de.akribos.app
            sleep 55
            xcrun simctl io "$udid" screenshot "screenshots/$kind-reader.png"
            xcrun simctl shutdown "$udid"
          done < "$RUNNER_TEMP/capture-devices.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        continue-on-error: true
        with:
          name: akribos-ios-store-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve public screenshots in logs if artifact quota is exhausted
        if: steps.upload.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for p in Path('screenshots').glob('*.png'):
              print('SCREENSHOT_BEGIN '+p.name)
              s=base64.b64encode(p.read_bytes()).decode()
              for i in range(0,len(s),2000): print(s[i:i+2000])
              print('SCREENSHOT_END '+p.name)
          PY

name: iOS Store Screenshots
on:
  push:
    branches: [codex/ios-store-screenshots-20261027]
    paths: [.github/workflows/ios-store-screenshots.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - name: Compile minimal app and select iPhone
        run: |
          mkdir -p Probe.app
          cat > probe.swift <<'SWIFT'
          import UIKit
          import Security
          @main class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            func application(_ application: UIApplication, didFinishLaunchingWithOptions opts: [UIApplication.LaunchOptionsKey:Any]?) -> Bool {
              let query: [String:Any] = [kSecClass as String:kSecClassGenericPassword,kSecAttrService as String:UUID().uuidString,kSecAttrAccount as String:"fixture",kSecValueData as String:Data("fixture".utf8)]
              let status = SecItemAdd(query as CFDictionary,nil)
              print("KEYCHAIN_PROBE_STATUS=\(status)")
              fflush(stdout)
              let win=UIWindow(frame:UIScreen.main.bounds)
              win.rootViewController=UIViewController()
              win.makeKeyAndVisible()
              window=win
              DispatchQueue.main.asyncAfter(deadline:.now()+1){exit(0)}
              return true
            }
          }
          SWIFT
          arch=$(uname -m)
          xcrun --sdk iphonesimulator swiftc -parse-as-library -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target "$arch-apple-ios15.0-simulator" probe.swift -o Probe.app/Probe
          python3 - <<'PY'
          import plistlib,json,subprocess,os
          from pathlib import Path
          Path('Probe.app/Info.plist').write_bytes(plistlib.dumps({'CFBundleExecutable':'Probe','CFBundleIdentifier':'de.akribos.keychainprobe','CFBundleName':'Probe','CFBundleVersion':'1','CFBundlePackageType':'APPL','UILaunchScreen':{}}))
          ds=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          d=next(d for r,ls in ds['devices'].items() if 'iOS' in r for d in ls if d['name']=='iPhone 16 Pro')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DEVICE='+d['udid']+'\n')
          PY
      - name: Boot simulator
        run: |
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Reproduce missing entitlement and verify simulator embedding
        run: |
          python3 - <<'PYTHON'
          import plistlib
          from pathlib import Path
          Path('simulated.plist').write_bytes(plistlib.dumps({'application-identifier':'8Y4NL9VW33.de.akribos.keychainprobe','keychain-access-groups':['8Y4NL9VW33.de.akribos.keychainprobe']}))
          PYTHON
          for variant in baseline embedded; do
            echo "PROBE_VARIANT=$variant"
            if [ "$variant" = embedded ]; then
              derq query -f xml -i simulated.plist -o simulated.der --raw
              arch=$(uname -m)
              xcrun --sdk iphonesimulator swiftc -parse-as-library -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target "$arch-apple-ios15.0-simulator" probe.swift -o Probe.app/Probe -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker simulated.plist -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __ents_der -Xlinker simulated.der
            fi
            codesign --force --sign - Probe.app
            xcrun simctl install "$DEVICE" Probe.app
            output=$(xcrun simctl launch --console --terminate-running-process "$DEVICE" de.akribos.keychainprobe 2>&1)
            printf '%s\n' "$output"
            if [ "$variant" = baseline ]; then
              echo "$output" | grep -q 'KEYCHAIN_PROBE_STATUS=-34018'
            else
              echo "$output" | grep -q 'KEYCHAIN_PROBE_STATUS=0'
            fi
            xcrun simctl uninstall "$DEVICE" de.akribos.keychainprobe
          done
  screenshots:
    needs: probe
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configure app-scoped simulator Keychain access
        run: |
          python3 - <<'PYTHON'
          import plistlib
          from pathlib import Path
          p=Path('ios/Runner/Runner.entitlements')
          ent=plistlib.loads(p.read_bytes())
          ent['application-identifier']='8Y4NL9VW33.de.akribos.app'
          ent['keychain-access-groups']=['8Y4NL9VW33.de.akribos.app']
          p.write_bytes(plistlib.dumps(ent))
          PYTHON
      - run: flutter build ios --simulator --debug --no-pub
      - name: Verify embedded simulator entitlements
        run: |
          otool -l build/ios/iphonesimulator/Runner.app/Runner | grep -A 3 'sectname __ent'
          python3 - <<'PYTHON'
          from pathlib import Path
          app=Path('build/ios/iphonesimulator/Runner.app')
          assert b'8Y4NL9VW33.de.akribos.app' in (app/'Runner').read_bytes(), 'Missing embedded application entitlement'
          PYTHON
      - name: Capture live public reader on iPhone and iPad
        shell: bash
        run: |
          mkdir -p screenshots
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'devices.json').read_text())
          devices=[d for runtime,ds in data['devices'].items() if 'iOS' in runtime for d in ds if d.get('isAvailable')]
          selected=[]
          for kind, names in [('iphone',['iPhone 16 Pro','iPhone 15 Pro','iPhone 16','iPhone 15']),('ipad',['iPad Pro 13-inch (M4)','iPad Pro 13-inch (M5)','iPad Pro (12.9-inch) (6th generation)'])]:
              match=next((d for name in names for d in devices if d['name']==name),None)
              if not match: raise SystemExit(f'Missing supported {kind}: {devices}')
              selected.append({'kind':kind,**match})
          Path('screenshots/devices.json').write_text(json.dumps(selected,indent=2))
          Path(os.environ['RUNNER_TEMP']+'/capture-devices.tsv').write_text(''.join(d['kind']+'\t'+d['udid']+'\n' for d in selected))
          PY
          while IFS=$'\t' read -r kind udid; do
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcrun simctl ui "$udid" appearance light
            xcrun simctl install "$udid" build/ios/iphonesimulator/Runner.app
            xcrun simctl launch "$udid" de.akribos.app
            sleep 55
            xcrun simctl io "$udid" screenshot "screenshots/$kind-reader.png"
            xcrun simctl shutdown "$udid"
          done < "$RUNNER_TEMP/capture-devices.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        continue-on-error: true
        with:
          name: akribos-ios-store-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve public screenshots in logs if artifact quota is exhausted
        if: steps.upload.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for p in Path('screenshots').glob('*.png'):
              print('SCREENSHOT_BEGIN '+p.name)
              s=base64.b64encode(p.read_bytes()).decode()
              for i in range(0,len(s),2000): print(s[i:i+2000])
              print('SCREENSHOT_END '+p.name)
          PY

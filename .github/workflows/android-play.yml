name: Android Play Internal Testing

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published vX.Y.Z release to upload; normally set by the release dispatcher'
        type: string
        required: false
      bootstrap_version:
        description: 'First manual Play upload only: X.Y.Z; mutually exclusive with release_tag'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-play-internal
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # Includes up to 45 minutes waiting for the exact main CI.
    environment: android-play-internal
    permissions:
      contents: write # Atomic, permanent version-code reservation refs only.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
      PLAY_BOOTSTRAP_ALLOWED: ${{ vars.PLAY_BOOTSTRAP_ALLOWED }}
      PLAY_VERSION_CODE_FLOOR: ${{ vars.PLAY_VERSION_CODE_FLOOR }}
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the published tag and wait for the exact main CI
        timeout-minutes: 46
        run: python3 scripts/play_release.py wait-for-ci
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Install pinned Google API dependencies
        run: |
          python3.12 -m venv "$RUNNER_TEMP/akribos-play-tools"
          "$RUNNER_TEMP/akribos-play-tools/bin/pip" install --require-hashes --only-binary=:all: -r scripts/play-requirements.txt
          echo "$RUNNER_TEMP/akribos-play-tools/bin" >> "$GITHUB_PATH"
      - name: Read Play versions and reserve a unique build number
        id: identity
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play_release.py plan
      - name: Build the production Android App Bundle
        env:
          VERSION_NAME: ${{ steps.identity.outputs.version }}
          BUILD_NUMBER: ${{ steps.identity.outputs.build }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build appbundle --no-pub --release \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=AKRIBOS_SERVER=https://akribos.de
      - name: Download checksum-pinned official bundletool
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            -o "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Sign with the existing upload key and verify the bundle
        id: signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: python3 scripts/play_release.py sign
      - name: Upload only to Google Play Internal Testing
        if: steps.identity.outputs.mode == 'publish'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play_release.py publish
      - name: Preserve bundle, checksum and actual publication result
        if: ${{ always() && steps.signing.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: akribos-play-${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.build }}
          path: build/play-store/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary upload key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/akribos-upload.jks"

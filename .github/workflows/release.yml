name: Dispatch Internal Store Releases
on:
  release:
    types: [published]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workflow: [android-play.yml, ios-testflight.yml]
    steps:
      # No checkout and no store environment/secrets. The receiving workflow is
      # always the trusted main version, never code from the released tag.
      - name: Start the protected store workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_WORKFLOW: ${{ matrix.workflow }}
        shell: bash
        run: |
          release_tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          [[ "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            printf 'Expected a published vX.Y.Z release.\n' >&2
            exit 1
          }
          args=(--ref main -f "release_tag=$release_tag")
          if [[ "$STORE_WORKFLOW" == ios-testflight.yml ]]; then
            # The receiving workflow independently checks the source against
            # the operator's pinned encryption attestation before signing.
            args+=(-f encryption_exempt=true)
          fi
          gh workflow run "$STORE_WORKFLOW" --repo "$GITHUB_REPOSITORY" "${args[@]}"
